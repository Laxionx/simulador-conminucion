[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conminucion"
version = "0.1.0"
description = "Simulador de circuitos de molienda y clasificación desde ecuaciones publicadas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthony Vera Baldeón" }]
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[tool.setuptools]
packages = ["conminucion"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["conminucion"]
